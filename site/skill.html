function detectLang() {
  try {
    var saved = localStorage.getItem('archi_lang');
    if (saved && LANGS.indexOf(saved) >= 0) return saved;
  } catch (e) {}
  var q = new URLSearchParams(location.search).get('lang');
  if (q && LANGS.indexOf(q) >= 0) return q;
  var cands = (navigator.languages && navigator.languages.length)
    ? navigator.languages : [navigator.language || 'en'];
  for (var i = 0; i < cands.length; i++) {
    var l = String(cands[i]).toLowerCase();
    if (l.indexOf('zh') === 0) {
      if (l.indexOf('tw') >= 0 || l.indexOf('hk') >= 0 || l.indexOf('mo') >= 0 || l.indexOf('hant') >= 0) return 'zh-TW';
      return 'zh-CN';
    }
    if (l.indexOf('ja') === 0) return 'ja';
    if (l.indexOf('en') === 0) return 'en';
  }
  return 'en';
}

var LANG = detectLang();

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderLangs() {
  var nav = document.getElementById('langs');
  nav.innerHTML = LANGS.map(function (l) {
    return '<button type="button" data-lang="' + l + '" aria-current="' + (l === LANG) + '">' + LANG_LABEL[l] + '</button>';
  }).join('');
  nav.querySelectorAll('button').forEach(function (b) {
    b.addEventListener('click', function () { setLang(b.dataset.lang); });
  });
}

function render() {
  var d = T[LANG];
  document.documentElement.lang = LANG;
  document.body.setAttribute('data-lang', LANG);

  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    var v = d[el.dataset.i18n];
    if (v) el.textContent = v;
  });

  document.getElementById('order').innerHTML =
    ORDER[LANG].map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('');

  document.getElementById('cases').innerHTML = CASES.map(function (c, i) {
    return '<div class="case' + (c.portrait ? ' portrait' : '') + '">' +
      '<h3>' + esc(d.titles[i]) + '</h3>' +
      '<div class="case-meta">' +
        '<span class="tag">' + esc(d.cat[c.cat]) + '</span>' +
        '<span class="tag ' + c.type + '">' + esc(d.type[c.type]) + '</span>' +
        '<span class="tag">' + esc(c.model) + '</span>' +
      '</div>' +
      '<a href="/p/' + c.pid + '"><img src="/uploads/' + c.img + '.webp" alt="' + esc(d.titles[i]) + '" loading="lazy"></a>' +
      '<pre><code>' + esc(c.prompt) + '</code></pre>' +
      '<p class="note">' + esc(d.notes[i]) + '</p>' +
    '</div>';
  }).join('');

  document.getElementById('thumbs').innerHTML = THUMBS.map(function (t, i) {
    return '<a href="/p/' + t.pid + '"><img src="/uploads/' + t.img + '.webp" alt="' + esc(d.thumbCaps[i]) + '" loading="lazy">' + esc(d.thumbCaps[i]) + '</a>';
  }).join('');

  document.getElementById('inside').innerHTML = d.inside.map(function (r) {
    return '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>';
  }).join('');
}

function setLang(l) {
  if (LANGS.indexOf(l) < 0) return;
  LANG = l;
  try { localStorage.setItem('archi_lang', l); } catch (e) {}
  renderLangs();
  render();
}

renderLangs();
render();
